env_type: dreamdojo_wm
wm_env_type: trocar
task_suite_name: pick_trocar

total_num_envs: null
auto_reset: false
ignore_terminations: false
max_steps_per_rollout_epoch: 240
max_episode_steps: 240
use_rel_reward: false
reward_coef: 1.0

seed: 0
group_size: 1
use_fixed_reset_state_ids: false
use_ordered_reset_state_ids: false
specific_reset_id: null
is_eval: false
eval_unique_episodes: false
# Optional eval-only per-case raw/annotated video + exact classifier trace.
# Text is never fed back to the policy, WM or reward classifier.
video_audit_dir: null
video_audit_label: null

video_cfg:
  save_video: false
  fps: 15
  info_on_video: true
  video_base_dir: ${runner.logger.log_path}/video/train

enable_offload: true
# Validated at 35 steps: exact fixed-action and full policy-loop parity.
# See docs/dreamdojo/history/OPTIMIZATION_LOG.md for rollback switches.
cache_text_embeddings: true
skip_zero_guidance: true
# null inherits enable_offload. Split flags allow rollout-resident DiT/VAE.
wm_offload_diffusion_model: null
wm_offload_tokenizer: null
# Cached text stays on CPU after warmup, including standalone evaluation.
wm_offload_text_encoder: true
dreamdojo_root: ${oc.env:DREAMDOJO_ROOT,../DreamDojo}
model_path: ${oc.env:DREAMDOJO_WM_CHECKPOINT,../models/dreamdojo/lora_r32_lr3e-4_r64_18k/checkpoints/iter_000018000/model_ema_bf16.pt}
experiment_name: dreamdojo_2b_480_640_g1_hf_teleop_rollout_posttrain_lora_lr3e-4_r64
action_statistics: ${oc.env:DREAMDOJO_ACTION_STATISTICS,${.dreamdojo_root}/shared_meta/G1_stats.json}

initial_image_path:
  - ${oc.env:DREAMDOJO_DATA_ROOT,../data}/pick_trocar_teleop_success_train
  - ${oc.env:DREAMDOJO_DATA_ROOT,../data}/pick_trocar_rollouts_30k_bs256_train
  - ${oc.env:DREAMDOJO_DATA_ROOT,../data}/pick_trocar_rollouts_10k_bs32_train
initial_image_mixing_weights: [0.34, 0.33, 0.33]
video_key: head_view
video_backend: decord
random_start_frame: false
enable_kir: false
# Train-only, single-image reset near annotated handover; no Wan-style context.
# Probability is conditional on an eligible episode, not on all sampled groups.
kir_probability: 0.5
kir_max_offset_frames: 30

num_inference_steps: 35
# Native 30-Hz commands: consume 6 of the 12 generated WM frames.
chunk: 12
condition_frame_length: 1
num_frames: 13
image_size: [480, 640]
action_dim: 28
state_dim: 28

reward_model:
  type: MilestoneRewardV2
  from_pretrained: ${oc.env:DREAMDOJO_REWARD_CHECKPOINT,${..dreamdojo_root}/outputs/milestone/v2/best.pt}
  duplicate_for_30fps: true
