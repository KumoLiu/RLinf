defaults:
  - env/dreamdojo_trocar@env.train
  - env/dreamdojo_trocar@env.eval
  - model/gr00t_n1d7@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    # Best-run recipe uses eight cluster GPUs. The local shell entry excludes
    # faulty GPU 4 and adjusts env/global batch counts for seven ranks.
    # Native train/eval share the same devices; there is no separate eval pool.
    actor,env,rollout: ${oc.env:DREAMDOJO_GPUS,'0-7'}

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: dreamdojo_trocar_grpo_gr00t_n1d7
    logger_backends: ["tensorboard"]
  max_epochs: 1000
  max_steps: -1
  only_eval: false
  per_worker_log: true
  val_check_interval: 5
  save_interval: 5
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 8
  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level
  adv_type: grpo
  loss_type: actor
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  reward_coef: 1.0
  filter_rewards: false
  log_group_reward_stats: true

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 2
    total_num_envs: 64
    num_inference_steps: 15
    enable_kir: false
    group_size: ${algorithm.group_size}
    # 240 native 30-Hz commands = 8 seconds = 120 WM frames.
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    reward_coef: ${algorithm.reward_coef}
    auto_reset: false
    enable_offload: true
    # Keep WM resident within a rollout, offload at native train/eval boundaries.
    wm_offload_diffusion_model: false
    wm_offload_tokenizer: false
    use_fixed_reset_state_ids: false
    video_cfg:
      # Native recorder; disable via CLI for runs that do not need train videos.
      save_video: true
      fps: 15
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/train
  eval:
    rollout_epoch: 1
    total_num_envs: 56
    num_inference_steps: 35
    enable_kir: false
    group_size: 1
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    auto_reset: false
    ignore_terminations: true
    is_eval: true
    use_fixed_reset_state_ids: true
    # 55 fixed dataset indices, plus one compute-only padding slot.
    eval_unique_episodes: true
    enable_offload: true
    wm_offload_diffusion_model: false
    wm_offload_tokenizer: false
    initial_image_path:
      - ${oc.env:DREAMDOJO_DATA_ROOT,../data}/pick_trocar_teleop_success_validation
      - ${oc.env:DREAMDOJO_DATA_ROOT,../data}/pick_trocar_rollouts_30k_bs256_val
      - ${oc.env:DREAMDOJO_DATA_ROOT,../data}/pick_trocar_rollouts_10k_bs32_val
    initial_image_mixing_weights: null
    video_cfg:
      save_video: true
      fps: 15
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  enable_offload: true
  pipeline_stage_num: 1
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 8
  global_batch_size: 128
  seed: 1234
  enable_offload: true
  model:
    model_type: gr00t_n1d7
    model_path: ${oc.env:GR00T_MODEL_PATH,../models/s2r_models_dev/yunl/sft/g1/pick_trocar/g1_pick_trocar_head_10k_bs32_lr1e-4}
    embodiment_tag: new_embodiment
    obs_converter_type: g1_dex3_wm
    action_dim: 28
    num_action_chunks: 12
    denoising_steps: 4
    add_value_head: false
    rl_head_config:
      # Flow-SDE provides exploration; no noise on physical targets.
      # Override noise_level for ablations; keep physical-target noise at zero.
      noise_level: 0.3
      action_noise_scale: 0.0
      noise_anneal: false
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.01
    clip_grad: 1.0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    # Every rank loads the same complete GR00T checkpoint before FSDP wrapping.
    # Avoid a redundant nested-module broadcast that hangs for this architecture.
    sync_module_states: false
    gradient_checkpointing: true
    use_orig_params: true
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
